services:
  - type: web
    name: rag-webapp-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HF_HOME
        value: /opt/render/hf_cache
      - key: PYTHON_VERSION
        value: 3.11.9
    healthCheckPath: /api/health
    plan: free
